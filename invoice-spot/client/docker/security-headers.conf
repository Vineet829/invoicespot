# Included in each location that sets its own headers: nginx drops the
# server's add_header lines in a location that has any.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Fonts come from Google; QR codes are data: images; PDFs are printed from a
# blob: frame. Logos linked from other sites are blocked, and the settings
# screen says so (src/features/settings/logo.js), so keep the two in step.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
