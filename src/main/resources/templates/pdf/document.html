<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="utf-8" />
<title th:text="${pdf.title() + ' ' + pdf.number()}">Invoice</title>
<style>
  @page {
    size: A4;
    margin: 16mm 16mm 18mm 16mm;
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font-family: sans-serif;
      font-size: 8pt;
      color: #6b7080;
    }
  }
  body { margin: 0; font-family: sans-serif; font-size: 9.5pt; line-height: 1.45; color: #4f5566; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 0; vertical-align: top; }
  .head td { padding-bottom: 22px; }
  .logo { max-height: 56px; max-width: 150px; margin-bottom: 12px; }
  .sender-name { font-size: 13pt; color: #232735; font-weight: bold; margin-bottom: 4px; }
  .muted { color: #5d6170; }
  .doc { text-align: right; width: 46%; }
  .title { font-size: 28pt; font-weight: normal; color: #232735; letter-spacing: -0.5pt; line-height: 1.1; }
  .number { font-size: 10pt; color: #5b47a0; margin: 4px 0 12px; }
  .meta { width: auto; margin-left: auto; }
  .meta td { padding: 1px 0 1px 18px; }
  .meta .k { color: #6b7080; text-align: left; }
  .meta .v { color: #232735; text-align: right; }
  .badge { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 9px; font-size: 8.5pt; }
  .badge.paid { background: #e5e1f8; color: #4a3a80; }
  .badge.partial { background: #eeeaf9; color: #4a3a80; }
  .badge.unpaid { background: #fbe3d8; color: #9c4526; }
  .band { background: #f3f2f8; border-radius: 12px; }
  .band td { padding: 14px 16px; }
  .label { font-size: 8pt; text-transform: uppercase; letter-spacing: 0.8pt; color: #6b7080; margin-bottom: 5px; }
  .client-name { font-size: 11pt; color: #232735; font-weight: bold; margin-bottom: 3px; }
  .items { margin-top: 22px; -fs-table-paginate: paginate; }
  .items th { font-size: 8pt; font-weight: normal; text-transform: uppercase; letter-spacing: 0.6pt; color: #6b7080; text-align: left; padding: 0 8px 7px 0; border-bottom: 1px solid #d9d8e2; }
  .items td { padding: 9px 8px 9px 0; border-bottom: 1px solid #ecebf1; color: #232735; }
  .items .num { text-align: right; white-space: nowrap; }
  .items .index { color: #6b7080; width: 22px; }
  .items tr { page-break-inside: avoid; }
  .summary { width: 46%; margin: 16px 0 0 auto; }
  .summary td { padding: 4px 0; }
  .summary .v { text-align: right; color: #232735; white-space: nowrap; }
  .summary .balance td { border-top: 1px solid #d9d8e2; padding-top: 10px; font-size: 11pt; color: #30234f; font-weight: bold; }
  .notes { margin-top: 26px; page-break-inside: avoid; }
  .notes p { margin: 0; white-space: pre-wrap; }
  .notes .block { margin-bottom: 16px; }
</style>
</head>
<body>
  <table class="head">
    <tr>
      <td>
        <img th:if="${pdf.logo() != null}" th:src="${pdf.logo()}" class="logo" alt="" />
        <div class="sender-name" th:text="${pdf.sender()}">Business</div>
        <div class="muted" th:each="line : ${pdf.senderLines()}" th:text="${line}">Contact line</div>
      </td>
      <td class="doc">
        <div class="title" th:text="${pdf.title()}">Invoice</div>
        <div class="number" th:text="${pdf.number()}">INV-0001</div>
        <table class="meta">
          <tr>
            <td class="k">Issued</td>
            <td class="v" th:text="${pdf.issued()}">Sep 30, 2026</td>
          </tr>
          <tr th:if="${pdf.due() != null}">
            <td class="k" th:text="${pdf.dueLabel()}">Due</td>
            <td class="v" th:text="${pdf.due()}">Oct 15, 2026</td>
          </tr>
        </table>
        <span th:if="${pdf.status() != null}" th:class="${'badge ' + pdf.statusTone()}" th:text="${pdf.status()}">Unpaid</span>
      </td>
    </tr>
  </table>

  <table class="band">
    <tr>
      <td>
        <div class="label">Bill to</div>
        <div class="client-name" th:text="${pdf.clientName()}">Client</div>
        <div th:each="line : ${pdf.clientLines()}" th:text="${line}">Client line</div>
      </td>
    </tr>
  </table>

  <table class="items">
    <thead>
      <tr>
        <th class="index">#</th>
        <th>Item</th>
        <th class="num">Qty</th>
        <th class="num">Unit price</th>
        <th class="num">Discount</th>
        <th class="num">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${pdf.items()}">
        <td class="index" th:text="${item.index()}">1</td>
        <td th:text="${item.name()}">Item</td>
        <td class="num" th:text="${item.quantity()}">1</td>
        <td class="num" th:text="${item.unitPrice()}">0.00</td>
        <td class="num" th:text="${item.discount()}">0%</td>
        <td class="num" th:text="${item.amount()}">0.00</td>
      </tr>
      <tr th:if="${pdf.items().isEmpty()}">
        <td></td>
        <td colspan="5" class="muted">No items</td>
      </tr>
    </tbody>
  </table>

  <table class="summary">
    <tr th:each="row : ${pdf.totals()}">
      <td th:text="${row.label()}">Subtotal</td>
      <td class="v" th:text="${pdf.currency() + ' ' + row.value()}">USD 0.00</td>
    </tr>
    <tr class="balance">
      <td th:text="${pdf.balanceLabel()}">Balance due</td>
      <td class="v" th:text="${pdf.currency() + ' ' + pdf.balance()}">USD 0.00</td>
    </tr>
  </table>

  <div class="notes" th:if="${pdf.notes() != null or pdf.terms() != null}">
    <div class="block" th:if="${pdf.notes() != null}">
      <div class="label">Notes</div>
      <p th:text="${pdf.notes()}">Notes</p>
    </div>
    <div class="block" th:if="${pdf.terms() != null}">
      <div class="label">Terms &amp; conditions</div>
      <p th:text="${pdf.terms()}">Terms</p>
    </div>
  </div>
</body>
</html>
