<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
  <!-- Amounts in a column on the right, ending with the one that matters. -->
  <table class="summary" th:fragment="totals(currency, rows, balanceLabel, balance)">
    <tr th:each="row : ${rows}" th:class="${row.tone()}">
      <td th:text="${row.label()}">Subtotal</td>
      <td class="v" th:text="${currency + ' ' + row.value()}">USD 0.00</td>
    </tr>
    <tr class="balance">
      <td th:text="${balanceLabel}">Balance due</td>
      <td class="v" th:text="${currency + ' ' + balance}">USD 0.00</td>
    </tr>
  </table>
</body>
</html>
